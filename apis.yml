aid: elemental-cognition
name: Elemental Cognition
description: >-
  Elemental Cognition is a New York based artificial intelligence company founded in 2015 by Dr. David
  Ferrucci, the researcher who led the IBM Watson Jeopardy! project. The company builds a neuro-symbolic
  AI platform that pairs fine-tuned large language models with a formal, multi-strategy reasoning engine,
  so that answers are produced by the reasoning engine over an explicit Formal Knowledge Model rather than
  by the language model itself. The platform is marketed for high-stakes decision work in supply chain,
  life sciences, higher education, travel and investment management, and it was the reasoning layer behind
  Bridgewater's AI investment fund. Elemental Cognition packaged this as the Cogent and Cora enterprise
  applications, delivered as SaaS on Google Cloud, in a customer's own cloud, or on premises. The company
  does not run a public developer program: the platform generates callable cloud APIs automatically from
  each customer's own knowledge model, so the contract is tenant-specific and never published publicly.
